# duel_atom_smith — per-sub-agent tier + prompt config.
#
# AGENT-DRIVEN tiering (CR mana-is-quota-not-model-selector 2026-06-01): this
# YAML declares the sub-agent's TIER and its prompt template version. The model
# itself is env-only: the crew reads the REQUIRED DUEL_ATOM_SMITH_MODEL env var
# as the chora-model-gateway logical_model_id (ADR-177) and the optional
# DUEL_ATOM_SMITH_FALLBACK_MODELS comma list as the agent-DECLARED fallback
# chain forwarded to InvokeRequest.fallback_logical_model_ids. Boot fails loud
# when DUEL_ATOM_SMITH_MODEL is unset, so no literal model name lives here or in
# the code.
#
# Mana is a token-budget QUOTA system (manaplugin gate), NOT a model selector —
# the old tieredmodelplugin is no longer registered. See
# feedback_mana_is_quota_not_model_selector.
#
# duel_atom_smith is a P1 single-agent (smith). Per-agent tiering:
#   - smith: CHEAP. The duel path runs inside processMatch's 10s ctx and MCQ
#     selection/generation is a bounded task.
#
# prompt_version selects the composer template version (currently the embedded v1).
agent: duel_atom_smith
sub_agents:
  smith:
    tier: cheap
    prompt_version: v1
